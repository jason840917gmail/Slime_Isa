<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Terrain cache visual regression</title>
<style>body{background:#101820;color:#e8f0ff;font:14px monospace}canvas,img{max-width:48%;vertical-align:top}pre{white-space:pre-wrap}</style>
<h1>Terrain cache visual regression</h1>
<p>Compares cached terrain with the frozen original renderer. Add ?renderer=canvas to test Canvas.</p>
<pre id="results">Running…</pre><div id="game"></div><div id="captures"></div>
<script type="module">
import Phaser from 'phaser';
import { TerrainTransitionRenderer } from '/src/game/features/world/TerrainTransitionRenderer.ts';
import { ReferenceTerrainTransitionRenderer } from '../fixtures/terrain-transition-reference.ts';

const results = document.querySelector('#results');
const output = [];
const renderer = new URLSearchParams(location.search).get('renderer');
const snapshot = (scene) => new Promise((resolve) => scene.game.renderer.snapshot(resolve));
const pixels = (image) => {
  const canvas = document.createElement('canvas'); canvas.width=image.width;canvas.height=image.height;
  const context=canvas.getContext('2d'); context.drawImage(image,0,0);
  return context.getImageData(0,0,canvas.width,canvas.height).data;
};
class TestScene extends Phaser.Scene {
  create() { this.runChecks().catch((error) => { results.textContent = `FAIL: ${error.stack}`; }); }
  async runChecks() {
    let failures = 0;
    for (const tileSize of [64,37]) {
      const width = tileSize*19, height=tileSize*17;
      const dimensions={tileSize,columns:19,rows:17,width,height};
      const grid=Array.from({length:17},(_,y)=>Array.from({length:19},(_,x)=>
        (x*13+y*7)%5<2 ? 'forest-moss' : 'forest-floor'));
      for (const [id,color] of [['forest-moss','#59bb65'],['forest-floor','#294859']]) {
        const texture=this.textures.createCanvas(`${id}-${tileSize}`,tileSize*2,tileSize);
        const ctx=texture.context;
        ctx.fillStyle=color;ctx.fillRect(0,0,tileSize*2,tileSize);
        ctx.fillStyle='#bfdc65';ctx.fillRect(3,4,tileSize/4,tileSize/3);
        ctx.fillStyle='#9b69ba';ctx.fillRect(tileSize+tileSize/3,2,tileSize/3,tileSize/2);
        // Transparent source pixels exercise premultiplied-alpha compositing.
        ctx.clearRect(tileSize/2,tileSize/2,tileSize/5,tileSize/4);
        texture.add(0,0,0,0,tileSize,tileSize);texture.add(1,0,tileSize,0,tileSize,tileSize);texture.refresh();
      }
      const tileFactory={
        resolveVisual(id,x,y){return {textureKey:`${id}-${tileSize}`,frame:(x+y)%2,flipX:x%2===1,flipY:y%2===1};},
        createOverlay:(id,x,y,depth)=>{
          const visual=tileFactory.resolveVisual(id,x,y);
          return this.add.image(x*tileSize,y*tileSize,visual.textureKey,visual.frame)
            .setOrigin(0).setFlip(visual.flipX,visual.flipY).setDepth(2000000000+depth);
        },
      };
      const base=[];
      grid.forEach((row,y)=>row.forEach((id,x)=>base.push(tileFactory.createOverlay(id,x,y,-2000000000))));
      const context={scene:this,tileFactory,dimensions,seed:42};
      for (const zoom of [1,0.75,0.5]) {
        this.cameras.main.setZoom(zoom).centerOn(512,512);
        const reference = new ReferenceTerrainTransitionRenderer(context).render(grid);
        const before = await snapshot(this);
        reference.destroy();
        const baselineTextures=this.textures.getTextureKeys().length;
        const cached = new TerrainTransitionRenderer(context).render(grid);
        const after = await snapshot(this);
        const a=pixels(before), b=pixels(after);
        let sum=0,changed=0;
        for(let index=0;index<a.length;index+=4){
          let max=0;
          for(let channel=0;channel<3;channel++){
            const delta=Math.abs(a[index+channel]-b[index+channel]);sum+=delta;max=Math.max(max,delta);
          }
          if(max>8)changed++;
        }
        const mean=sum/(a.length/4*3), percent=changed/(a.length/4)*100;
        const masks=this.children.list.filter((child)=>child.mask).length;
        cached.destroy();cached.destroy();
        const leaked=this.textures.getTextureKeys().length-baselineTextures;
        // Fractional-zoom stencil edges become filtered cached pixels; allow
        // small edge-only differences, but reject lost bands or chunk seams.
        const pass=mean<2.5 && percent<5 && masks===0 && leaked===0;
        if(!pass)failures++;
        output.push(`${pass?'PASS':'FAIL'} ${renderer??'webgl'} tile=${tileSize} zoom=${zoom}: mean RGB delta=${mean.toFixed(3)}, pixels >8=${percent.toFixed(2)}%, live masks=${masks}, leaked textures=${leaked}`);
        results.textContent=output.join('\n');
        if(tileSize===64&&zoom===1){before.alt='Original';after.alt='Cached';document.querySelector('#captures').replaceChildren(before,after);}
      }
      base.forEach((image)=>image.destroy());
      for(const id of ['forest-moss','forest-floor'])this.textures.remove(`${id}-${tileSize}`);
    }
    output.push(failures ? `${failures} CHECKS FAILED` : 'ALL CHECKS PASSED');
    results.textContent=output.join('\n');
    this.game.loop.sleep();
  }
}
new Phaser.Game({type:renderer==='canvas'?Phaser.CANVAS:Phaser.WEBGL,parent:'game',width:600,height:420,
  backgroundColor:'#182938',pixelArt:false,scene:TestScene,audio:{noAudio:true}});
</script>
</html>
