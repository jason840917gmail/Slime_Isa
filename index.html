<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slime Open World</title>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <style>
        #boot-loader { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; gap: 14px; background: #10191e; color: #d8fbff; font: 18px "Trebuchet MS", "Segoe UI Variable", sans-serif; text-align: center; }
        #boot-loader[hidden] { display: none; }
        #boot-loader .boot-loader-track { width: 360px; max-width: 70vw; height: 16px; border: 2px solid #3f6b5c; border-radius: 8px; overflow: hidden; background: #1c2b33; }
        #boot-loader .boot-loader-fill { width: 35%; height: 100%; border-radius: 8px; background: #86f0c3; animation: boot-loader-slide 1.2s ease-in-out infinite; }
        @keyframes boot-loader-slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
        @media (prefers-reduced-motion: reduce) { #boot-loader .boot-loader-fill { animation: none; width: 100%; opacity: 0.5; } }
      </style>
      <span>Loading Slime Isa…</span>
      <div class="boot-loader-track"><div class="boot-loader-fill"></div></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  </html>
